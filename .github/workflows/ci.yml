name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # No secrets, no quota, no network calls to Groq. The live suite is
      # deliberately excluded — it costs money and is non-deterministic.
      - name: Offline tests
        run: pytest -m "not live"
