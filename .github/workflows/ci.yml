name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # No secrets, no quota, no network calls to Groq. The live suite is
      # deliberately excluded — it costs money and is non-deterministic.
      - name: Offline tests
        run: pytest -m "not live"


  smoke-eval:
    runs-on: ubuntu-latest
    # Forks don't get secrets, so the job would fail with no key. Skip instead.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # One test per failure mode, N=1: retrieval, faithfulness, refusal.
      # The full matrix is run on demand with `make test-live`.
      - name: Smoke eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
        run: pytest -m live -k "recall_correct or faithful_to_chunks or is_refused or looks_up_the_order" -v
