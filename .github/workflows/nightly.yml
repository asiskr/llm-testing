name: Nightly

on:
  schedule:
    # 02:00 UTC - off-peak for Groq's free tier, and results are ready
    # before the working day starts.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The whole live suite, not the three smoke tests. Runs sequentially:
      # Groq's free tier is 8000 TPM and parallel requests queue until they
      # time out inside the harness.
      - name: Full live suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
        run: pytest -m live -v